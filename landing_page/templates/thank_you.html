<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - {{ company_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav>
            <div class="nav-links">
                <a href="/">Home</a>
            </div>
            <div class="nav-logo">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Brewer Lawn Designs" class="logo-img">
            </div>
        </nav>
    </header>

    <section class="thank-you">
        <h1>Thank You, {{ name }}!</h1>
        <p>We've received your request and will get back to you within 24 hours.</p>
        <p>In the meantime, feel free to give us a call if you have any questions.</p>
        <a href="/" class="btn-primary">Back to Home</a>
    </section>

    <footer>
        <p>&copy; 2026 {{ company_name }}. All rights reserved.</p>
    </footer>
</body>
</html>
