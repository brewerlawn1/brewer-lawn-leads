<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | {{ company_name }}</title>
    <meta name="description" content="Thank you for contacting Brewer Lawn Designs. We'll get back to you within 24 hours with your quote.">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://brewerlawndesigns.org/thank-you">

    <link rel="icon" type="image/png" href="/static/images/logo.png">
    <link rel="apple-touch-icon" href="/static/images/logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=20260216d">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <a href="#main-content" class="skip-nav">Skip to main content</a>
    <header>
        <nav aria-label="Main navigation">
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/#services">Services</a>
                <a href="/areas">Service Areas</a>
                <a href="/#contact">Contact</a>
            </div>
            <div class="nav-logo">
                <a href="/"><img src="{{ url_for('static', filename='images/logo.png') }}" alt="{{ company_name }}" class="logo-img"></a>
            </div>
        </nav>
    </header>

    <main id="main-content">
    <section class="thank-you">
        <h1>Thank You, {{ name }}!</h1>
        <p>We've received your request and will get back to you within 24 hours.</p>
        <p>In the meantime, feel free to give us a call if you have any questions.</p>
        <a href="/" class="btn-primary">Back to Home</a>
    </section>
    </main>

    <footer>
        <p>&copy; 2026 {{ company_name }}. All rights reserved.</p>
    </footer>
</body>
</html>
